<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Connect - Board Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .game-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(7, 60px);
            grid-template-rows: repeat(6, 60px);
            gap: 10px;
            background: #3498db;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .cell {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .cell:hover {
            transform: scale(1.05);
        }
        
        .cell.player1 {
            background: radial-gradient(circle at 30% 30%, #e74c3c, #c0392b);
        }
        
        .cell.player2 {
            background: radial-gradient(circle at 30% 30%, #f1c40f, #f39c12);
        }
        
        .status {
            font-size: 1.2em;
            margin: 15px 0;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .reset-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .reset-btn:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }
        
        .turn-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .player-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin: 0 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .active {
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Color Connect</h1>
        
        <div class="turn-indicator">
            <div class="player-marker player1 active" id="player1-indicator"></div>
            <div class="player-marker player2" id="player2-indicator"></div>
        </div>
        
        <div class="status" id="status">Player 1's Turn</div>
        
        <div class="board" id="board"></div>
        
        <button class="reset-btn" id="reset-btn">Reset Game</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const board = document.getElementById('board');
            const status = document.getElementById('status');
            const resetBtn = document.getElementById('reset-btn');
            const player1Indicator = document.getElementById('player1-indicator');
            const player2Indicator = document.getElementById('player2-indicator');
            
            const ROWS = 6;
            const COLS = 7;
            let currentPlayer = 1;
            let gameBoard = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            let gameActive = true;
            
            // Create the board
            function createBoard() {
                board.innerHTML = '';
                
                // Create clickable areas for each column
                for (let col = 0; col < COLS; col++) {
                    const column = document.createElement('div');
                    column.classList.add('column');
                    column.dataset.col = col;
                    
                    for (let row = ROWS - 1; row >= 0; row--) {
                        const cell = document.createElement('div');
                        cell.classList.add('cell');
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        column.appendChild(cell);
                    }
                    
                    column.addEventListener('click', handleColumnClick);
                    board.appendChild(column);
                }
            }
            
            // Handle column click
            function handleColumnClick(e) {
                if (!gameActive) return;
                
                const col = parseInt(e.currentTarget.dataset.col);
                const row = getFirstEmptyRow(col);
                
                if (row === -1) return; // Column is full
                
                // Update game board
                gameBoard[row][col] = currentPlayer;
                
                // Update UI
                const cells = document.querySelectorAll(`.cell[data-col="${col}"]`);
                cells[ROWS - 1 - row].classList.add(currentPlayer === 1 ? 'player1' : 'player2');
                
                // Check for win
                if (checkWin(row, col)) {
                    status.textContent = `Player ${currentPlayer} Wins!`;
                    gameActive = false;
                    return;
                }
                
                // Check for draw
                if (checkDraw()) {
                    status.textContent = "Game Ended in a Draw!";
                    gameActive = false;
                    return;
                }
                
                // Switch player
                currentPlayer = currentPlayer === 1 ? 2 : 1;
                updateStatus();
            }
            
            // Get first empty row in a column
            function getFirstEmptyRow(col) {
                for (let row = 0; row < ROWS; row++) {
                    if (gameBoard[row][col] === 0) {
                        return row;
                    }
                }
                return -1; // Column is full
            }
            
            // Check for win
            function checkWin(row, col) {
                const directions = [
                    [0, 1],  // Horizontal
                    [1, 0],  // Vertical
                    [1, 1],  // Diagonal down-right
                    [1, -1]  // Diagonal down-left
                ];
                
                for (const [dx, dy] of directions) {
                    let count = 1;
                    
                    // Check in positive direction
                    count += countDirection(row, col, dx, dy);
                    
                    // Check in negative direction
                    count += countDirection(row, col, -dx, -dy);
                    
                    if (count >= 4) {
                        return true;
                    }
                }
                
                return false;
            }
            
            // Count consecutive pieces in a direction
            function countDirection(row, col, dx, dy) {
                let r = row + dx;
                let c = col + dy;
                let count = 0;
                
                while (
                    r >= 0 && r < ROWS && 
                    c >= 0 && c < COLS && 
                    gameBoard[r][c] === currentPlayer
                ) {
                    count++;
                    r += dx;
                    c += dy;
                }
                
                return count;
            }
            
            // Check for draw
            function checkDraw() {
                return gameBoard.every(row => row.every(cell => cell !== 0));
            }
            
            // Update status and player indicators
            function updateStatus() {
                status.textContent = `Player ${currentPlayer}'s Turn`;
                
                if (currentPlayer === 1) {
                    player1Indicator.classList.add('active');
                    player2Indicator.classList.remove('active');
                } else {
                    player1Indicator.classList.remove('active');
                    player2Indicator.classList.add('active');
                }
            }
            
            // Reset game
            function resetGame() {
                gameBoard = Array(ROWS).fill().map(() => Array(COLS).fill(0));
                currentPlayer = 1;
                gameActive = true;
                createBoard();
                updateStatus();
            }
            
            // Event listeners
            resetBtn.addEventListener('click', resetGame);
            
            // Initialize game
            createBoard();
        });
    </script>
</body>
</html>
